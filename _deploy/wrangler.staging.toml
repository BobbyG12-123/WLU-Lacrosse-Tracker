# Staging: the same code against the separate wlu-tracker-test project. Synthetic data only. Prepared, not deployed.
# The test project's web key and the rules fingerprint get added under [vars] before deploying (DEPLOY.md, step 4).
name = "wlu-tracker-staging"
main = "../_chat/gateway/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "BudgetLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetLedger"]

[vars]
FIREBASE_PROJECT_ID = "wlu-tracker-test"
STAFF_PROBE_DOC = "app/roster"
STAFF_CACHE_S = "300"
SESSION_SECONDS = "3600"
OWNER_EMAILS = ""
MODEL = "claude-haiku-5-5"
EFFORT = "low"
MAX_OUTPUT_TOKENS = "3000"
MAX_INPUT_BYTES = "160000"
MAX_ROUNDS = "8"
MAX_CALL_SECONDS = "90"
MAX_IN_FLIGHT = "4"
RESERVATION_TTL_S = "600"
BUDGET_USD = "10"
FIXED_HOSTING_USD = "0"
SAFETY_MARGIN_USD = "1"
PRIOR_SPEND_JSON = "{}"
CHAT_DISABLED = "1"
