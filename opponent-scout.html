<body>
<main>
  <div class="ann" id="ann">Colors: <b style="color:var(--critical)">red = bad for W&amp;L</b>, <b style="color:var(--good)">green = good for W&amp;L</b>. Showing <b>2027 returners</b> (seniors &amp; grad students hidden). <span id="upd"></span></div>
  <div class="vbar">
    <h1 class="vtitle">Opponent</h1>
    <div class="picker"><input id="q" placeholder="Search any D3 or D1 team…" autocomplete="off"><div class="dd" id="dd" hidden></div></div>
    <div class="pins" id="pins"></div>
  </div>
  <div id="app"><p class="note">Loading scouting data…</p></div>
</main>
<aside class="drawer" id="drawer" aria-label="Player card"></aside>
<script>
// ---------- data: read from Firestore through the tracker that hosts this page (staff sign-in) ----------
// the tracker's DB variable is script-scoped, so connect through its firebase app (same signed-in user)
const HOST = (() => { try { const P = window.parent; return P !== window && P.firebase && P.firebase.apps.length && P.firebase.auth().currentUser ? P : null; } catch (e) { return null; } })();
const DBX = window.__STUB_DB || (HOST && HOST.firebase.firestore());
const ME = (HOST && HOST.firebase && HOST.firebase.auth().currentUser && HOST.firebase.auth().currentUser.email) || window.__STUB_ME || 'staff';
let D = { opp: null, wl: null, cards: {}, meta: null, pinned: [] };
let T = null, LEAGUE_N = 0, TEAMNAME = {}, FILMS = {};
const WL_ID = 410;
// records are stored as one JSON string field 'j' (Firestore can't hold the nested arrays in game logs and clip lists)
const unpack = x => (x && typeof x.j === 'string' ? JSON.parse(x.j) : x);
async function getDoc(col, id) { const d = await DBX.collection(col).doc(String(id)).get(); return d.exists ? unpack(d.data()) : null; }
async function getCards(teamId) {
  const qs = await DBX.collection('lrPlayers').where('team', '==', teamId).get();
  const out = {}; qs.forEach(d => { const c = unpack(d.data()); out[c.id] = c; }); return out;
}
// theme follows the tracker
function syncTheme() { try { const t = HOST && HOST.document.documentElement.dataset.theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pc = v => v == null ? '—' : (100 * v).toFixed(v >= .995 ? 0 : 1).replace(/\.0$/, '') + '%';
const f1 = v => v == null ? '—' : (+v).toFixed(1);
const f2 = v => v == null ? '—' : (+v).toFixed(2);

async function openTeam(id) {
  $('#app').innerHTML = '<p class="note">Loading…</p>'; $('#drawer').classList.remove('open');
  try {
    const [t, cards] = await Promise.all([getDoc('lrTeams', id), getCards(id)]);
    if (!t) { $('#app').innerHTML = '<p class="note">No scouting record for that team yet.</p>'; return; }
    D.opp = t; T = t; LEAGUE_N = t.n_league; Object.assign(D.cards, cards);
    try { marked = new Set(JSON.parse(localStorage.getItem('wluMarked:' + id) || '[]')); } catch (e) { marked = new Set(); }

  const t = r.threat; if (!t || !t.qual) return null;
  if (r.role !== 'offensive') return t.score;

  return Math.round(Object.keys(W).reduce((a, k) => a + t.ing[k] * W[k], 0) / tot);

function others(list) {

function gradList() {

  </tbody></table></div></details>`;
}
function spark(vals, color, w = 300, h = 56) {
  if (!vals.length) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => `${(i / Math.max(1, vals.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (v - mn) / sp * (h - 8)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;grid-column:1 / -1"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;

function buildGameWeek() {

  add(S.clips?.settled_goals, 2, ([id, v, j, film]) => clipObj(id, v, `Their settled goal — ${jName(j)}`, film, null, 'goal'));
  add(S.clips?.goals_allowed_off_picks, 3, ([id, v, j, film]) => clipObj(id, v, `Beating them with a pick (#${j})`, film, null, 'goal'));
  add(S.clips?.failed_clears, 2, ([id, v, j, film, vEnd]) => clipObj(id, v, 'Their failed clear (ride them)', film, vEnd, 'poss'));

        <div><div class="k">Man-up</div><div class="v">${sd.man_up[1]}/${sd.man_up[0]}</div><div class="p">goals / shots</div></div></div>
      <div class="kv" style="margin-top:6px"><div><div class="k">When it matters</div><div class="v">${sd.high_leverage ? sd.high_leverage[1] : '—'}</div><div class="p">goals on ${sd.high_leverage?.[0] ?? 0} shots, win chance 20–80%</div></div>
        <div><div class="k">Garbage time</div><div class="v">${sd.garbage ? sd.garbage[1] : '—'}</div><div class="p">goals with the game decided</div></div>
        <div><div class="k">Late shot clock</div><div class="v">${sd.late_clock ? sd.late_clock[1] + '/' + sd.late_clock[0] : '—'}</div><div class="p">goals / shots, under 10s</div></div>
        <div><div class="k">Leverage share</div><div class="v">${sd.high_leverage && sd.shots ? pc(sd.high_leverage[0] / sd.shots) : '—'}</div><div class="p">of his shots</div></div></div>
      <b style="font-size:12px;display:block;margin-top:10px">How his shots end</b>
      <div style="display:flex;height:18px;margin:5px 0">${Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<i title="${k}" style="flex:${v};background:${cols[k]}"></i>`).join('')}</div>
      <div class="legend" style="flex-wrap:wrap">${Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span><i style="background:${cols[k]}"></i>${k} ${pc(v / tot)}</span>`).join('')}</div>
      <div class="bars" style="margin-top:10px"><span class="hd">Score state</span><span class="hd">Share of his shots</span><span class="hd" style="text-align:right">Sh%</span><span class="hd" style="text-align:right">Shots</span>${sit('leading', 'Leading')}${sit('tied', 'Tied')}${sit('trailing', 'Trailing')}</div>`;
  }
  if (gd) {
    const qs = gd.quarter_share || [];
    h += `<h5>When + against whom</h5>
      <div class="kv"><div><div class="k">vs top 25</div><div class="v">${gd.vs_top25 ? gd.vs_top25.ppg : '—'}</div><div class="p">pts/g · ${gd.vs_top25?.n || 0} games</div></div><div><div class="k">vs others</div><div class="v">${gd.vs_others ? gd.vs_others.ppg : '—'}</div><div class="p">pts/g</div></div>
        <div><div class="k">Opp.-adjusted</div><div class="v">${gd.adj_ppg ?? '—'}</div><div class="p">pts/g vs average D (raw ${gd.ppg})</div></div><div><div class="k">Consistency</div><div class="v" style="font-size:17px">${(r.threat?.tags || []).includes('Steady') ? 'Steady' : (r.threat?.tags || []).includes('Boom/bust') ? 'Boom / bust' : 'Normal'}</div><div class="p">${gd.ppg} ± ${gd.spread ?? '—'} pts/g</div></div></div>
      <div class="bars" style="margin-top:10px"><span class="hd">Quarter</span><span class="hd">Share of his value added</span><span></span><span></span>${qs.map((v, i) => `<span>Q${i + 1}</span><span class="t"><i style="width:${v * 100}%;background:var(--critical)"></i></span><span class="v">${pc(v)}</span><span></span>`).join('')}</div>`;
  }
  if (c?.fo_h2h?.length) {
    h += `<h5>Faceoff head-to-head</h5><div class="tw"><table><thead><tr><th class="l">Opponent FOGO</th><th class="l">Team</th><th>Won</th><th>Lost</th></tr></thead><tbody>${c.fo_h2h.slice(-8).reverse().map(f => `<tr><td class="l">${esc(f.opp_fogo)}</td><td class="l">${esc(TEAMNAME[f.opp] || '')}</td><td>${f.w}</td><td>${f.l}</td></tr>`).join('')}</tbody></table></div>`;
  }
  if (r.role === 'goalkeeper') {
    const dp = (T.def_shot_profile?.this_year || []).reduce((a, p) => (a[p.tag] = p.buckets, a), {});
    const b2 = dp.shot_clock_remaining_bucket || [];
    h += `<h5>Shots against ${esc(T.name)} by shot clock</h5><div class="bars">${b2.map(x => `<span>${({ 0: '0–19s left', 20: '20–39s', 40: '40–59s', 60: '60s+' })[x.bucket] ?? x.bucket}</span><span class="t"><i style="width:${Math.min(100, x.pct / .6 * 100)}%;background:${x.pct < x.league_avg ? 'var(--critical)' : 'var(--good)'}"></i><u style="left:${Math.min(100, x.league_avg / .6 * 100)}%"></u></span><span class="v">${pc(x.pct)}</span><span class="s">${x.shots}</span>`).join('')}</div><p class="note">Opponents' shooting % (team level, all goalies). Red = better than D3 average.</p>`;
  }
  const pb = c?.pbp;
  if (pb) {
    const nmAny = p => { const r = T.roster.find(x => x.player_ID === p) || D.wl.roster.find(x => x.player_ID === p); return r ? esc(r.player) : '#' + p; };
    const list = (L, f) => (L || []).map(([p, n, name, team]) => `${name ? esc(name) + (team && team !== T.name ? ' <small style="color:var(--muted)">' + esc(team) + '</small>' : '') : f(p)} (${n})`).join(', ');
    h += `<h5>Who he plays with</h5><div class="note" style="margin:0">
      ${pb.goals ? `<b>Goals:</b> ${pb.goals} · ${pb.unassisted_pct != null ? pc(pb.unassisted_pct) + ' unassisted' : ''}${pb.assisted_by?.length ? ` · fed by ${list(pb.assisted_by, nmAny)}` : ''}${pb.top_feeder_share != null ? ` · <b>${pc(pb.top_feeder_share)}</b> of his goals come from one feeder${pb.top_feeder_share >= .25 ? ' — take that feeder away' : ''}` : ''}<br>` : ''}
      ${pb.assists_to?.length ? `<b>His assists go to:</b> ${list(pb.assists_to, nmAny)}<br>` : ''}
      ${pb.turnovers ? `<b>Turnovers:</b> ${pb.turnovers} (${pb.to_forced} forced, ${pb.to_transition ?? 0} in transition)${pb.to_forced_by?.length ? ` · most often by ${list(pb.to_forced_by, p => '#' + p)}` : ''}<br>` : ''}
      ${pb.caused ? `<b>Takeaways:</b> ${pb.caused}${pb.caused_off?.length ? ` · off ${list(pb.caused_off, p => '#' + p)}` : ''}` : ''}</div>`;
    if (pb.goalie) {
      const g = pb.goalie, row = (l, v) => v && v[0] ? `<span>${l}</span><span class="t"><i style="width:${(v[1] || 0) * 100}%;background:var(--critical)"></i></span><span class="v">${pc(v[1])}</span><span class="s">${v[0]}</span>` : '';
      h += `<h5>Saves by situation</h5><div class="bars"><span class="hd">Shots on goal</span><span class="hd">Save %</span><span class="hd" style="text-align:right">Sv%</span><span class="hd" style="text-align:right">SOG</span>
        ${row('All', [g.sog, g.sv_pct])}${row('Transition (≤10s)', g.transition)}${row('Settled', g.settled)}${row('Assisted shots', g.vs_assisted)}${row('Unassisted shots', g.vs_unassisted)}${Object.entries(g.by_q || {}).map(([q, v]) => row('Q' + q, v)).join('')}</div>`;
    }
  }
  if (c?.sb && Object.keys(c.sb.goals || {}).length) {
    const g2 = c.sb.goals, s2 = c.sb.shots || {}, keys = Object.keys(s2).sort((a, b) => (s2[b] || 0) - (s2[a] || 0)).slice(0, 6);
    const xg2 = c.sb.xg;
    h += `<h5>Goals by possession type (film)</h5>${xg2 && xg2.shots >= 15 ? `<p class="note" style="margin-top:0"><b>Shot quality:</b> ${xg2.goals} goals on ${xg2.shots} film-matched shots vs ${xg2.xg} expected · <b style="color:${xg2.goals - xg2.xg >= 0 ? 'var(--critical)' : 'var(--good)'}">${xg2.goals - xg2.xg >= 0 ? '+' : ''}${(xg2.goals - xg2.xg).toFixed(1)}</b> (${xg2.goals - xg2.xg >= 3 ? 'finishing above his chances' : xg2.goals - xg2.xg <= -3 ? 'below his chances' : 'about what his chances deserve'})</p>` : ''}<div class="tw"><table><thead><tr><th class="l">Possession</th><th>Shots</th><th>Goals</th><th>Sh%</th></tr></thead><tbody>${keys.map(k => `<tr><td class="l">${esc(k.replace(/\+/g, ' + '))}</td><td>${s2[k]}</td><td>${g2[k] || 0}</td><td>${pc((g2[k] || 0) / s2[k])}</td></tr>`).join('')}</tbody></table></div>
      <p class="note"><b>His goals on film:</b> ${(() => { const st = CLIPREG.length; const html = (c.sb.clip_goals || []).slice(0, 12).map(([id, v, ty, pk, dg, as, film]) => clipLink(id, v, `${ty}${pk ? '+pick' : ''}${dg ? '+dodge' : ''}`, film, null, 'goal')).join(' '); const idx = []; for (let i = st; i < CLIPREG.length; i++) idx.push(i); return playAll(idx) + ' ' + html; })()}</p>`;
  }
  h += `<h5>Role + usage</h5><div class="kv"><div><div class="k">Plays</div><div class="v">${pc(r.team_play_shares)}</div><div class="p">of team plays</div></div><div><div class="k">Games</div><div class="v">${r.games_appeared_in ?? 0}</div></div><div><div class="k">Class 2027</div><div class="v">${esc({ FR: 'SO', SO: 'JR', JR: 'SR', SR: 'GR?', GR: '—' }[r.team_listed_class] || '—')}</div><div class="p">was ${esc(r.team_listed_class)}</div></div><div><div class="k">LR role</div><div class="v" style="font-size:16px">${esc(r.raw_team_listed_role || r.role || '')}</div></div></div>`;
  h += `<h5>Form</h5>${log.length ? `<div class="form"><div><div style="font-family:var(--num);font-size:24px;font-weight:700">${a5.toFixed(1)}</div><div class="note" style="margin:0">pts/g last 5 · season ${avg.toFixed(1)}</div><div style="margin-top:4px;font-weight:600">${trend}</div></div>${spark(pts, 'var(--critical)')}</div>
      <p class="note">Best: ${gl(best[0][1])}<br>Worst: ${gl(best[best.length - 1][1])}${useBox ? '<br><i>From box scores (no LR player page for him).</i>' : ''}</p>` : '<p class="note">No games logged for this player.</p>'}`;
  h += `<h5>vs ours</h5>${ours ? `<div class="vs"><span class="hd">${esc(r.player.split(' ').slice(-1)[0])}</span><span></span><span class="hd r">${esc(ours.player)}</span>
      ${vsRows.map(k => { const a = i[k], o = ours.threat.ing[k]; return `<span class="a"><i style="width:${a}%"></i><span>${a ?? '—'}</span></span><span class="c">${k.replace(/([a-z])([A-Z])/g, '$1 $2')}</span><span class="b"><i style="width:${o}%"></i><span>${o ?? '—'}</span></span>`; }).join('')}</div>
      <p class="note">D3 percentiles. Matched to our returning ${esc((ROLE[r.role] || '').toLowerCase())} player with the most similar role (share of team plays).</p>` : '<p class="note">No matching W&L returner.</p>'}`;
  h += '</div>';
  const d = $('#drawer'); d.innerHTML = h; d.classList.add('open'); $('#dx').onclick = () => d.classList.remove('open');
}
// ---------- clip player + reels ----------
let REEL = [], RI = 0, PLAYCTX = null;
function openPlayer(list, i, ctx) {
  REEL = list; RI = i || 0; PLAYCTX = ctx || null;
  let p = $('#player'); if (!p) { p = document.createElement('div'); p.id = 'player'; p.className = 'player'; document.body.appendChild(p); }
  p.hidden = false; showClip();
}
function showClip(barOnly) {
  const p = $('#player'), c = REEL[RI]; if (!c) return closePlayer();
  if (barOnly && $('#tagbar')) { $('#tagbar').innerHTML = tagBar(c); if (PLAYCTX === 'tag') wireTagBar(p); if (PLAYCTX === 'shot') wireShotBar(p); return; }
  p.innerHTML = `<video id="pv" controls playsinline preload="auto"></video>
    <div class="pbar"><b>${esc(c.label)}</b><span>${esc(c.team || '')} · ${mmss(c.start)}–${mmss(c.end)}</span><span class="sp"></span>
      <span>${RI + 1} / ${REEL.length}</span><button id="pprev">◀ Prev</button><button id="preplay">↺ Replay</button><button id="pnext">Next ▶</button>
      ${PLAYCTX === 'session' ? '' : '<button id="padd">＋ Session</button>'}<a href="${SBURL(c.sb)}" target="_blank" rel="noopener" style="color:#8FB5FF;font-size:12px">open in ScoreBreak ↗</a><button id="pclose">✕ Close</button></div>
    ${PLAYCTX === 'session' && c.note ? `<div class="note2" style="color:#E3A92B">Coach note: ${esc(c.note)}</div>` : ''}
    <div id="tagbar" style="width:min(1100px,100%)">${PLAYCTX === 'tag' || PLAYCTX === 'shot' ? tagBar(c) : ''}</div>`;
  const v = $('#pv'); v.src = c.mp4 + '#t=' + c.start;
  v.addEventListener('loadedmetadata', () => { v.currentTime = c.start; v.play().catch(() => {}); }, { once: true });
  v.addEventListener('timeupdate', () => { if (v.currentTime >= c.end) { if (PLAYCTX === 'tag' || PLAYCTX === 'shot') { v.currentTime = c.start; } else if (RI < REEL.length - 1) { RI++; showClip(); } else v.pause(); } });
  if (PLAYCTX === 'tag') wireTagBar(p); if (PLAYCTX === 'shot') wireShotBar(p);
  $('#pprev').onclick = () => { if (RI > 0) { RI--; showClip(); } };
  $('#pnext').onclick = () => { if (RI < REEL.length - 1) { RI++; showClip(); } };
  $('#preplay').onclick = () => { v.currentTime = c.start; v.play(); };
  $('#pclose').onclick = closePlayer;
  const a = $('#padd'); if (a) a.onclick = () => { addToSession(c); a.textContent = '✓ Added'; };
}
function closePlayer() { const p = $('#player'); const wasTag = PLAYCTX === 'tag' || PLAYCTX === 'shot'; if (p) { const v = $('#pv'); if (v) v.pause(); p.hidden = true; p.innerHTML = ''; } PLAYCTX = null; if (wasTag) render(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-clip]'); if (b) { const i = +b.dataset.clip; openPlayer([CLIPREG[i]], 0); return; }
  const r = e.target.closest('[data-reel]'); if (r) { const list = r.dataset.reel.split(',').map(i => CLIPREG[+i]); openPlayer(list, 0); return; }
  const a = e.target.closest('[data-add]'); if (a) { addToSession(CLIPREG[+a.dataset.add]); a.textContent = '✓'; return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#drawer').classList.remove('open'); closePlayer(); }
  const p = $('#player'); if (p && !p.hidden && PLAYCTX === 'tag' && /^[1-6]$/.test(e.key)) { const b = p.querySelectorAll('[data-tsub],[data-tag]')[+e.key - 1]; if (b) b.click(); return; }
  if (p && !p.hidden) { if (e.key === 'ArrowRight' && RI < REEL.length - 1) { RI++; showClip(); } if (e.key === 'ArrowLeft' && RI > 0) { RI--; showClip(); } }
});
// ---------- film-session builder: sessions are shared by all staff (Firestore filmSessions) ----------
let SESS = { name: 'Film session', clips: [] }, SESS_ID = null, SESS_LIST = [], sessTimer = null;
const newSess = () => ({ name: (T ? T.name : 'Film') + ' film session', opponent: T ? T.name : '', clips: [] });
async function loadSessions() {
  const qs = await DBX.collection('filmSessions').orderBy('updatedAt', 'desc').limit(40).get();
  SESS_LIST = []; qs.forEach(d => SESS_LIST.push(Object.assign({ id: d.id }, d.data())));
  let want = null; try { want = localStorage.getItem('wluSessId'); } catch (e) {}
  const cur = SESS_LIST.find(x => x.id === want);
  if (cur) { SESS_ID = cur.id; SESS = { name: cur.name, opponent: cur.opponent, clips: cur.clips || [] }; } else { SESS_ID = null; SESS = newSess(); }
}
const saveSess = () => {
  renderSessBtn();
  clearTimeout(sessTimer);
  sessTimer = setTimeout(async () => {
    const body = { name: SESS.name, opponent: SESS.opponent || (T ? T.name : ''), clips: SESS.clips, updatedAt: new Date().toISOString(), updatedBy: ME };
    try {
      if (!SESS_ID) { if (!SESS.clips.length) return; body.createdBy = ME; body.createdAt = body.updatedAt; const r = await DBX.collection('filmSessions').add(body); SESS_ID = r.id; SESS_LIST.unshift(Object.assign({ id: r.id }, body)); try { localStorage.setItem('wluSessId', SESS_ID); } catch (e) {} if ($('#sess') && !$('#sess').hidden) renderSess(); }
      else { await DBX.collection('filmSessions').doc(SESS_ID).set(body, { merge: true }); const x = SESS_LIST.find(y => y.id === SESS_ID); if (x) Object.assign(x, body); }
    } catch (e) { console.error('session save failed', e); }
  }, 600);
};
function addToSession(c) { if (!c) return; const { sb, mp4, start, end, label, team } = c; if (!SESS.clips.some(x => x.mp4 === mp4 && x.start === start)) SESS.clips.push({ sb, mp4, start, end, label, team: team || '', note: c.note || '' }); saveSess(); }
function renderSessBtn() { let b = $('#sessbtn'); if (!b) { b = document.createElement('button'); b.id = 'sessbtn'; b.className = 'sessbtn'; document.body.appendChild(b); b.onclick = toggleSess; } b.textContent = `🎬 Film session (${SESS.clips.length})`; }
function toggleSess() { let s = $('#sess'); if (!s) { s = document.createElement('div'); s.id = 'sess'; s.className = 'sess'; document.body.appendChild(s); s.hidden = true; } s.hidden = !s.hidden; if (!s.hidden) renderSess(); }
function renderSess() {
  const s = $('#sess');
  s.innerHTML = `<div class="sh"><input id="sname" value="${esc(SESS.name)}"><button id="sclose" style="background:none;border:0;color:#fff;cursor:pointer">✕</button></div>
    <div style="display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-2);align-items:center"><select id="spick" style="flex:1;padding:4px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
      ${SESS_ID ? '' : '<option value="">(new — not saved yet)</option>'}${SESS_LIST.map(x => `<option value="${x.id}" ${x.id === SESS_ID ? 'selected' : ''}>${esc(x.name)} · ${(x.clips || []).length} clips · ${esc((x.updatedBy || '').split('@')[0])}</option>`).join('')}</select>
      <button id="snew" style="border:1px solid var(--line);background:var(--card);padding:4px 8px;cursor:pointer;color:var(--ink)">＋ New</button></div>
    ${SESS.clips.map((c, i) => `<div class="row"><b>${i + 1}</b><div>${esc(c.label)} <small style="color:var(--muted)">${esc(c.team || '')} ${mmss(c.start)}</small><input data-note="${i}" placeholder="Coaching point for this clip…" value="${esc(c.note || '')}"></div>
      <div style="display:flex;gap:3px"><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button data-del="${i}">✕</button></div></div>`).join('') || '<p class="note" style="padding:12px">Add clips with ＋ from any clip list or the player.</p>'}
    <div class="sf"><button id="splay">▶ Play session</button><button id="sclear" style="background:var(--card-2);color:var(--ink);border:1px solid var(--line)">Clear</button></div>
    <p class="note" style="padding:0 12px 10px">Sessions save for all staff — anyone can open, edit or play them.</p>`;
  $('#sname').oninput = e => { SESS.name = e.target.value; saveSess(); };
  $('#sclose').onclick = toggleSess;
  $('#spick').onchange = e => { const x = SESS_LIST.find(y => y.id === e.target.value); if (x) { SESS_ID = x.id; SESS = { name: x.name, opponent: x.opponent, clips: (x.clips || []).slice() }; try { localStorage.setItem('wluSessId', SESS_ID); } catch (er) {} renderSessBtn(); renderSess(); } };
  $('#snew').onclick = () => { SESS_ID = null; SESS = newSess(); try { localStorage.removeItem('wluSessId'); } catch (er) {} renderSessBtn(); renderSess(); };
  $('#splay').onclick = () => SESS.clips.length && openPlayer(SESS.clips, 0, 'session');
  $('#sclear').onclick = () => { SESS.clips = []; saveSess(); renderSess(); };
  s.querySelectorAll('[data-note]').forEach(x => x.oninput = () => { SESS.clips[+x.dataset.note].note = x.value; saveSess(); });
  s.querySelectorAll('[data-up]').forEach(x => x.onclick = () => { const i = +x.dataset.up; if (i > 0) { [SESS.clips[i - 1], SESS.clips[i]] = [SESS.clips[i], SESS.clips[i - 1]]; saveSess(); renderSess(); } });
  s.querySelectorAll('[data-down]').forEach(x => x.onclick = () => { const i = +x.dataset.down; if (i < SESS.clips.length - 1) { [SESS.clips[i + 1], SESS.clips[i]] = [SESS.clips[i], SESS.clips[i + 1]]; saveSess(); renderSess(); } });
  s.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { SESS.clips.splice(+x.dataset.del, 1); saveSess(); renderSess(); });
}
// ---------- boot ----------
(async function boot() {
  if (!DBX) { $('#app').innerHTML = '<p class="warnbox">Open this from the tracker (Opponent → Scouting) while signed in.</p>'; return; }
  syncTheme(); try { new HOST.MutationObserver(syncTheme).observe(HOST.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  try {
    const [meta, wl] = await Promise.all([getDoc('app', 'lrMeta'), getDoc('lrTeams', WL_ID)]);
    if (!meta || !wl) { $('#app').innerHTML = '<p class="warnbox">Scouting data hasn’t been imported yet. The owner can load it from Data Health → Import LR data.</p>'; return; }
    D.meta = meta; D.wl = wl; TEAMNAME = Object.fromEntries(meta.teams.map(t => [t.id, t.name])); FILMS = (meta.sb_league || {}).films || {};
    W0 = Object.assign({}, meta.weights.offensive); W = Object.assign({}, W0);
    $('#upd').textContent = '· LR data as of ' + meta.updated;
    const seen = new Set(); D.pinned = [];
    for (const g of wl.games || []) if (g.opponentID && !seen.has(g.opponentID) && TEAMNAME[g.opponentID]) { seen.add(g.opponentID); D.pinned.push([g.opponentID, TEAMNAME[g.opponentID]]); }
    D.pinned.sort((a, b) => a[1].localeCompare(b[1]));
    Object.assign(D.cards, await getCards(WL_ID));
    await Promise.all([loadTags(), loadSessions()]);
    renderSessBtn();
    let start = null; try { start = +localStorage.getItem('wluScoutTeam') || null; } catch (e) {}
    await openTeam(start && TEAMNAME[start] ? start : (D.pinned[0] || [WL_ID])[0]);
  } catch (e) { console.error(e); $('#app').innerHTML = `<p class="warnbox">Could not load scouting data: ${esc(e.message || e)}. If this says "permission", the Firestore rules need the new collections (see the PR notes).</p>`; }
})();
</script>
