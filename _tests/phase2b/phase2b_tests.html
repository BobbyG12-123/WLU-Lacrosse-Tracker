    T.summary = nj(`(() => { const R = wmModel('2027'), season = '2027', out = { audit: { skill: +(R.skill * 100).toFixed(2), grade: +(R.skillGrade * 100).toFixed(2), forward: +(R.forwardSkill * 100).toFixed(2), forwardN: R.forwardN, ok: R.ok } };
      const Rc = scCompare(${DEF}), Show = (lever, from, to, k, c) => { const r = wmCompute(c || Rc, { lever, from, to, n: k }).res; return r.est ? { d: +r.d.toFixed(2), per: +r.per.toFixed(3), base: +r.base.toFixed(1), jack: +r.jack.toFixed(2), calib: +r.calibSd.toFixed(2), lo: +r.lo.toFixed(1), hi: +r.hi.toFixed(1), loNew: +r.loNew.toFixed(1), hiNew: +r.hiNew.toFixed(1), prop: +r.propShare.toFixed(3), max: +r.support.max.toFixed(3), pts: +r.gapPts.toFixed(0) } : { why: r.why }; };
      out.teamAlleyInside5 = Show('loc', 'Alley', 'Inside', 5); out.teamAlleyInsideAll = Show('loc', 'Alley', 'Inside', 1000); out.teamHeavyOpen5 = Show('pressure', 'Heavy', 'Open', 5); out.teamLightOpen5 = Show('pressure', 'Light', 'Open', 5); out.teamDodgeCatch5 = Show('dodge', 'Off the dodge', 'Off the catch', 5); out.teamSideOver5 = Show('release', 'Sidearm', 'Overhand', 5); out.teamTopInside5 = Show('loc', 'Top', 'Inside', 5);

      const sh = wiSeasonShots(season, 'Practice'), c = {}; sh.forEach(s => { c[s.shooterJersey] = (c[s.shooterJersey] || 0) + 1; }); const big = Object.keys(c).filter(j => c[j] >= 30);
      const tally = {}; const reason = r => r.est ? (r.lo <= 0 && r.hi >= 0 ? 'estimate: cannot distinguish' : 'estimate: range excludes zero') : r.idle ? 'nothing to change' : /located shots in Period B/.test(r.why) ? 'too few shots by subject' : /above the highest share/.test(r.why) ? 'above observed share' : /misses the gap/.test(r.why) ? 'gap missed' : /team shot/.test(r.why) ? 'too few team shots' : /miss by more/.test(r.why) ? 'situation missed' : 'other';
      const moves = {}; ['Alley', 'Inside', 'Low/GLE', 'Top', 'Wing'].forEach(k => { moves[k] = 0; });
      let doorAll = { est: 0, none: 0 }, ranges = [], news = [], jk = [];
      big.forEach(j => { const Rj = scCompare({ season, type: 'Practice', period: '10', subject: j, grouping: 'groups' }); WM_LEVERS.forEach(l => { const vals = l.k === 'loc' ? Rj.keys : l.opts; vals.forEach(from => vals.forEach(to => { if (from === to) return; const r = wmCompute(Rj, { lever: l.k, from, to, n: 3 }).res, key = reason(r); tally[key] = (tally[key] || 0) + 1; if (r.est) { ranges.push((r.hi - r.lo) / 2); news.push((r.hiNew - r.loNew) / 2); jk.push(1.96 * r.jack); } })); });
        ['Alley', 'Low/GLE', 'Top'].forEach(from => { const r = wmCompute(Rj, { lever: 'loc', from, to: 'Inside', n: 1000 }).res; if (r.idle) return; if (r.est) doorAll.est++; else doorAll.none++; }); });
      const med = a => a.length ? +a.slice().sort((x, y) => x - y)[a.length >> 1].toFixed(2) : null;
      out.players = big.length; out.playerGrid3Shots = tally; out.medAvgRange = med(ranges); out.medNewRun = med(news); out.medFitPartOnly = med(jk); out.moveAllToInside = doorAll;
      // Later sessions, untouched: fit on earlier practices, then compare the model's gap with the counted gap in the last 5.
      const pr = [...new Set(sh.map(scSid))].sort(), last = new Set(pr.slice(-5)), train = R.shots.filter(s => !last.has(scSid(s))), m = fitXg2(train), test = R.shots.filter(s => last.has(scSid(s)));
      const pairs = []; WM_LEVERS.forEach(l => { const vals = l.k === 'loc' ? SC_GROUPS : l.opts; vals.forEach(a => vals.forEach(b => { if (a >= b) return; const of = s => l.of(s, 'groups'), A = test.filter(s => of(s) === a), B = test.filter(s => of(s) === b); if (A.length < 25 || B.length < 25) return; const rate = x => x.filter(s => s.goal === 1).length / x.length, ra = rate(A), rb = rate(B), obs = rb - ra; const spots = l.k === 'loc' ? train.filter(s => of(s) === b).map(s => ({ lat: s.lateralYds, dist: s.distanceYds })) : null; const gapM = A.reduce((t, s) => { const p = xg2Profile(s); return t + (spots ? spots.reduce((u, q) => u + predictXg2(m, Object.assign({}, p, q)) - predictXg2(m, p), 0) / spots.length : predictXg2(m, l.set(p, b)) - predictXg2(m, p)); }, 0) / A.length; const se = Math.sqrt(ra * (1 - ra) / A.length + rb * (1 - rb) / B.length), z = (obs - gapM) / se; pairs.push({ k: l.k, a, b, nA: A.length, nB: B.length, obs: +(obs * 100).toFixed(1), model: +(gapM * 100).toFixed(1), z: +z.toFixed(2) }); })); });
      out.laterSessions = { pairs: pairs.length, within2SE: pairs.filter(p => Math.abs(p.z) <= 2).length, sameSign: pairs.filter(p => Math.sign(p.obs) === Math.sign(p.model)).length, list: pairs };
      return out; })()`);
  }

  // ===== Safety =====
  ok('no page errors', errs.length === 0, errs.slice(0, 5));
