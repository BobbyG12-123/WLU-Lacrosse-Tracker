  for (let i = 0; i < 160 && !(frames.old.__appReady && frames.neu.__appReady); i++) await sleep(500);

  Object.values(frames).forEach(w => { try { w.eval(`navSetGlobal('2027')`); } catch (e) { /* main may differ */ } });
